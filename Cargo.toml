[package]
name = "mcli"
version = "1.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
zip = "2.2"
dirs = "5.0"
indicatif = "0.17"
sha1_smol = "1.0.1"
md5 = "0.8.1"
regex-lite = "0.1.9"
sha2 = "0.11.1"
